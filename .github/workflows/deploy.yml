# Test, immagine Docker su GHCR e pubblicazione sul server.
# - push su main → ambiente di TEST (testgames.zerodarkteam.it);
# - «Run workflow» con ambiente «produzione» → PRODUZIONE (games.zerodarkteam.it), anche con azzeramento dei dati.
# La pubblicazione si spegne con la variabile di repository DEPLOY_ENABLED=false (vedi README).
name: Test e pubblicazione

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Dove pubblicare
        type: choice
        options: [test, produzione]
        default: test
      azzera:
        description: "Azzerare i dati (partite, account, impostazioni) prima di avviare? Per confermare scrivi AZZERA"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || 'test' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    name: Immagine Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Pubblicazione sul server
    needs: build
    # Si spegne solo con la variabile DEPLOY_ENABLED=false; altrimenti parte se ci sono i secrets.
    if: vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione') && 'production' || 'test' }}
      url: https://${{ (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione') && 'games' || 'testgames' }}.zerodarkteam.it
    env:
      PROD: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione' }}
      AZZERA: ${{ github.event_name == 'workflow_dispatch' && inputs.azzera == 'AZZERA' }}
      HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '209.227.239.117' }}
      USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      # Produzione e test: cartella, container, porta, dominio e dati separati sullo stesso server.
      DIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione') && (vars.DEPLOY_PATH || 'zerodarkgames') || 'zerodarkgames-test' }}
      ZDG_PORT: ${{ (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione') && (vars.ZDG_PORT || '8090') || '8091' }}
      DOMAIN: ${{ (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione') && (vars.DOMAIN || 'games.zerodarkteam.it') || 'testgames.zerodarkteam.it' }}
      CONTAINER: ${{ (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione') && 'zero-dark-games' || 'zero-dark-games-test' }}
      ZDG_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.ambiente == 'produzione') && 'production' || 'test' }}
      HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_USER != '' && secrets.MASTER_PASSWORD != '' }}
    steps:
      - name: Secrets presenti?
        id: check
        run: |
          if [ "$HAS_KEY" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Pubblicazione saltata: mancano i secrets DEPLOY_SSH_KEY, DEPLOY_USER o MASTER_PASSWORD (vedi deploy/CHIAVE-SSH.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Chiave SSH
        if: steps.check.outputs.ok == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Impronta della chiave del secret (pubblica): va confrontata con ssh-keygen -lf ~/.ssh/zdg-deploy.pub sul server.
          FP=$(ssh-keygen -lf ~/.ssh/deploy 2>&1) || { echo "::error::DEPLOY_SSH_KEY non è una chiave privata valida (copiala tutta, comprese le righe BEGIN/END)"; exit 1; }
          echo "::notice::Chiave del secret: $FP — utente: $USER"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy -p $PORT -o BatchMode=yes $USER@$HOST" >> "$GITHUB_ENV"
          echo "SCP=scp -i $HOME/.ssh/deploy -P $PORT -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Server pronto? (rileva docker / sudo docker, compose / docker-compose)
        if: steps.check.outputs.ok == 'true'
        run: |
          OUT=$($SSH "sh -s" < deploy/docker-detect.sh 2>diag.txt) || {
            echo "::error::Docker non utilizzabile sul server: $(paste -sd ';' diag.txt)"; cat diag.txt; exit 1; }
          echo "$OUT"
          D_PART="${OUT%%|COMPOSE=*}"
          echo "DOCKER=${D_PART#DOCKER=}" >> "$GITHUB_ENV"
          echo "COMPOSE=${OUT#*|COMPOSE=}" >> "$GITHUB_ENV"

      - name: File di produzione (.env dai secrets)
        if: steps.check.outputs.ok == 'true'
        env:
          MASTER_USER: ${{ secrets.MASTER_USER || 'master' }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
          OPS_ISSUER: ${{ vars.OPS_ISSUER || 'https://ops.zerodarkteam.it' }}
          OPS_CLIENT_ID: ${{ secrets.OPS_CLIENT_ID }}
          OPS_CLIENT_SECRET: ${{ secrets.OPS_CLIENT_SECRET }}
        run: |
          # Rete Docker di Caddy rilevata nei rilasci precedenti (vedi deploy/caddy-site.sh); il test la prende dalla produzione.
          PROXY_NETWORK=$($SSH "cat '$DIR/.proxy-network' 2>/dev/null || cat '${{ vars.DEPLOY_PATH || 'zerodarkgames' }}/.proxy-network' 2>/dev/null" || true)
          echo "PROXY_NETWORK=$PROXY_NETWORK" >> "$GITHUB_ENV"
          # Container di Caddy: da lì il gioco raggiunge i siti della stessa macchina (es. il gestionale)
          PROXY_INTERNO=""
          if [ -n "$PROXY_NETWORK" ]; then
            PROXY_INTERNO=$($SSH "$DOCKER ps --format '{{.Names}} {{.Image}}'" | awk 'tolower($2) ~ /caddy/ { print $1; exit }' || true)
          fi
          umask 077
          {
            echo "ZDG_IMAGE=$IMAGE:$GITHUB_SHA"
            echo "ZDG_PORT=$ZDG_PORT"
            echo "ZDG_CONTAINER=$CONTAINER"
            echo "ZDG_ENV=$ZDG_ENV"
            echo "PROXY_NETWORK=$PROXY_NETWORK"
            echo "MASTER_USER=$MASTER_USER"
            echo "MASTER_PASSWORD=$MASTER_PASSWORD"
            echo "MASTER_PASSWORD_RESET=1"
            echo "PUBLIC_URL=https://$DOMAIN"
            echo "VAPID_SUBJECT=mailto:consiglio@zerodarkteam.it"
            echo "PROXY_INTERNO=$PROXY_INTERNO"
            # «Accedi con Zero Dark Ops»: solo se l'app è registrata nel gestionale (secret OPS_CLIENT_ID).
            if [ -n "$OPS_CLIENT_ID" ]; then
              echo "OPS_ISSUER=$OPS_ISSUER"
              echo "OPS_CLIENT_ID=$OPS_CLIENT_ID"
              echo "OPS_CLIENT_SECRET=$OPS_CLIENT_SECRET"
            fi
          } > deploy.env

      - name: Copia sul server
        if: steps.check.outputs.ok == 'true'
        run: |
          $SSH "mkdir -p '$DIR'"
          $SCP deploy/docker-compose.prod.yml deploy/docker-compose.proxy.yml deploy/caddy-site.sh deploy/docker-detect.sh "$USER@$HOST:$DIR/"
          $SCP deploy.env "$USER@$HOST:$DIR/.env"
          $SSH "chmod 600 '$DIR/.env' && chmod 755 '$DIR/caddy-site.sh'"

      - name: Avvio della nuova versione
        if: steps.check.outputs.ok == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "$DOCKER login ghcr.io -u '${{ github.actor }}' --password-stdin"
          FILES="-f docker-compose.prod.yml"
          if [ -n "$PROXY_NETWORK" ]; then FILES="$FILES -f docker-compose.proxy.yml"; fi
          $SSH "cd '$DIR' && $COMPOSE $FILES pull"
          # Azzeramento (solo su richiesta esplicita «AZZERA»): copia compressa dei dati in $DIR/backup, poi volume vuoto.
          if [ "$AZZERA" = "true" ]; then
            VOL=$($SSH "$DOCKER inspect -f '{{range .Mounts}}{{if eq .Destination \"/data\"}}{{.Name}}{{end}}{{end}}' '$CONTAINER' 2>/dev/null" || true)
            if [ -z "$VOL" ]; then echo "::warning::Nessun dato da azzerare per $CONTAINER (primo avvio?)"; else
              TS=$(date -u +%Y%m%d-%H%M%S)
              $SSH "cd '$DIR' && mkdir -p backup && $COMPOSE $FILES stop zdg && $DOCKER run --rm -u 0 --entrypoint sh -v '$VOL':/data -v \"\$PWD/backup\":/backup '$IMAGE:$GITHUB_SHA' -c 'tar czf /backup/zdg-data-$TS.tgz -C /data . && find /data -mindepth 1 -delete'"
              echo "::notice::Dati di $DOMAIN azzerati; copia in ~/$DIR/backup/zdg-data-$TS.tgz"
            fi
          fi
          $SSH "cd '$DIR' && $COMPOSE $FILES up -d --remove-orphans"
          # Pulizia delle immagini vecchie: se ne sta già girando un'altra (deploy di test in parallelo) non è un errore.
          $SSH "$DOCKER image prune -f" || echo "::warning::Pulizia immagini rimandata (un'altra era in corso)"
          $SSH "$DOCKER logout ghcr.io >/dev/null"

      - name: Controllo di salute
        if: steps.check.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            if $SSH "curl -fsS http://127.0.0.1:$ZDG_PORT/api/health || wget -qO- http://127.0.0.1:$ZDG_PORT/api/health" >/dev/null 2>&1; then echo "Zero Dark Games risponde"; exit 0; fi
            sleep 3
          done
          $SSH "$DOCKER logs --tail 50 '$CONTAINER'" || true
          echo "::error::Il container non risponde su 127.0.0.1:$ZDG_PORT"
          exit 1

      # Aggiunge una sola volta il sito a Caddy (rilevato sul server), con copia e ripristino se la configurazione non è valida.
      - name: Sito su Caddy
        if: steps.check.outputs.ok == 'true' && vars.CADDY_AUTO != 'false'
        run: $SSH "DOCKER='$DOCKER' sh '$DIR/caddy-site.sh' '$DOMAIN' '$ZDG_PORT' '$DIR' '$CONTAINER'"

      - name: Il gioco raggiunge il gestionale?
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        env:
          OPS_ISSUER: ${{ vars.OPS_ISSUER || 'https://ops.zerodarkteam.it' }}
        run: $SSH "$DOCKER exec -i -e OPS='$OPS_ISSUER' '$CONTAINER' node -" < deploy/ops-check.js

      - name: Controllo dall'esterno
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://$DOMAIN/api/health"; then echo; echo "Online su https://$DOMAIN"; exit 0; fi
            sleep 6
          done
          echo "::warning::https://$DOMAIN non risponde ancora: controlla il record DNS (A → $HOST) e Caddy"

      - name: Pulizia
        if: always()
        run: rm -f ~/.ssh/deploy deploy.env diag.txt
