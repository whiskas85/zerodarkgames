<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iscrizione ai Giochi</title>
  <meta name="theme-color" content="#0f1310">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    main { max-width: 620px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 20px; }
    h1 { font-size: clamp(52px, 15vw, 84px); font-weight: 900; line-height: .86; }
    h1 em { font-style: normal; color: var(--blood); }
    h2 { font-size: 26px; }
    .lede { font-family: "Source Serif 4", Georgia, serif; font-size: 19px; margin: 0; }
    form, fieldset { display: grid; gap: 12px; }
    fieldset { border: 2px solid var(--line); padding: 16px; margin: 0; }
    legend { font-family: var(--f-display); font-size: 22px; text-transform: uppercase; padding: 0 6px; }
    .step { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
    .steps { display: flex; gap: 6px; }
    .steps i { flex: 1; height: 4px; background: var(--line); }
    .steps i.on { background: var(--blood); }

    /* Pagina 1: le tre sfide */
    .paths { display: grid; gap: 12px; }
    .path { display: grid; gap: 8px; padding: 18px 18px 16px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; }
    .path:hover, .path:focus-visible { border-color: var(--blood); box-shadow: inset 6px 0 0 var(--blood); background: var(--paper-2); }
    .path-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .path-title { font-family: var(--f-display); font-weight: 900; font-size: 32px; text-transform: uppercase; line-height: 1; }
    .path-tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .path p { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-size: 17px; line-height: 1.5; }
    .dare { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; color: var(--blood); letter-spacing: .02em; }
    .path-go { justify-self: start; margin-top: 4px; }

    /* Pagina 2: il modulo */
    .chosen { border-left: 6px solid var(--blood); padding: 4px 0 4px 14px; display: grid; gap: 6px; }
    .chosen .path-title { font-size: clamp(40px, 11vw, 60px); }
    .back { justify-self: start; }
    .done { border: 3px solid var(--ok); padding: 20px; background: var(--paper); display: grid; gap: 10px; }
    .done h2 { color: var(--ok); }
    .done p { margin: 0; }
    .access { display: grid; gap: 6px; }
    .access p { margin: 0; }
    .code { font-size: 32px; font-weight: 600; letter-spacing: .18em; }
    .auth-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--line); }
    .auth-tabs button { background: none; border: 0; color: var(--ink); font: inherit; font-weight: 700; padding: 12px 8px; cursor: pointer; }
    .auth-tabs button + button { border-left: 2px solid var(--line); }
    .auth-tabs button.on { background: var(--blood); color: #fff; }
    .who { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
    .who a, .linkish { color: var(--brass); background: none; border: 0; font: inherit; padding: 0; cursor: pointer; text-decoration: underline; }
    .card { display: grid; gap: 4px; }
    .stack { display: grid; gap: 12px; }
    .spots { display: inline-block; justify-self: start; margin: 2px 0 4px; padding: 3px 10px; border: 1px solid var(--ok, #6fbf73); color: var(--ok, #6fbf73); font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .spots-low { border-color: var(--warn); color: var(--warn); }
    .spots-full { border-color: var(--blood); color: var(--blood); }
    .path-full { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body>
  <main id="root"><p class="muted">Caricamento…</p></main>
  <script type="module">
    import { h, mount, api, toast } from '/js/lib.js';

    // Le tre strade, presentate come sfide. La chiave è anche l'indirizzo della pagina (#legati, #temerario, #eletti).
    const PATHS = {
      legati: {
        mode: 'pair',
        title: 'I Legati',
        tag: 'in coppia',
        text: [
          'Entrate nel bosco in due e ne uscirete in due, o non ne uscirete affatto. Il Consiglio vi affiderà un Settore e il suo Sigillo: un segreto da custodire con la vita.',
          'Darete la caccia agli Altari degli altri Settori, strapperete i loro Sigilli e raccoglierete i frammenti della Parola. Chi porta per primo la Parola intera alla Soglia libera il proprio Settore.',
          'Se uno cade, l\'altro lo vendica. Se uno fugge, l\'altro lo segue.',
        ],
        dare: 'Vi fidate abbastanza l\'uno dell\'altro per quattro ore di buio?',
        cta: 'Accettiamo la sfida',
        done: 'La vostra candidatura come Legati è arrivata al Consiglio. Se verrà accettata, il Consiglio vi assegnerà il Settore e il suo Altare.',
      },
      temerario: {
        mode: 'single',
        title: 'Il Temerario Solitario',
        tag: 'da solo',
        text: [
          'Entri da solo, ma non resterai solo a lungo. Il Consiglio ti legherà a un altro temerario estratto a sorte: un volto forse mai visto, che diventerà la tua ombra fino alla fine dei Giochi.',
          'Il vostro destino sarà uno solo: lo stesso Sigillo, la stessa caccia, la stessa Parola da riunire.',
        ],
        dare: 'Hai il fegato di affidare la tua sorte a uno sconosciuto?',
        cta: 'Accetto la sfida',
        done: 'La tua candidatura da Temerario Solitario è arrivata al Consiglio. Se verrà accettata, il Consiglio estrarrà il tuo compagno e ti assegnerà un Settore.',
      },
      eletti: {
        mode: 'elect',
        title: 'Gli Eletti del Consiglio',
        tag: 'al servizio del Consiglio',
        text: [
          'Non cercherete la Parola: la proteggerete. Gli Eletti sono la mano del Consiglio nel bosco. Tengono in piedi i Giochi (logistica, Altari, il Cuore, i doni) e ne difendono i luoghi dalle coppie troppo audaci.',
          'Nessun Sigillo da custodire, nessuna gloria in classifica: solo il potere silenzioso di chi decide come scorre il buio.',
        ],
        dare: 'Siete degni di servire il Consiglio?',
        cta: 'Mi offro al Consiglio',
        done: 'La tua candidatura agli Eletti del Consiglio è arrivata. Se verrà accettata, entrerai nella tua squadra e riceverai le istruzioni del Consiglio.',
      },
    };
    const MODE_KEY = { pair: 'legati', single: 'temerario', elect: 'eletti' };
    const STATUS = { pending: 'in attesa di approvazione', accepted: 'accettata dal Consiglio' };

    const root = document.getElementById('root');
    const S = { account: null, enrollments: [], games: [], gameId: null, sent: null, authTab: 'nuovo', ops: [] };
    // Gestionali per «Accedi con Zero Dark Ops» ed esito del ritorno dal gestionale.
    const opsLink = (o, collega = false) => `/auth/ops/${encodeURIComponent(o.id)}?ritorno=iscrizione${collega ? '&collega=1' : ''}`;
    {
      const sp = new URLSearchParams(location.search);
      if (sp.get('ops_errore')) toast(sp.get('ops_errore'), 'error', 8000);
      if (sp.get('ops') === 'collegato') toast('Gestionale collegato: da ora puoi entrare anche da lì', 'ok', 6000);
      if (sp.get('ops') === 'nuovo') toast('Account creato con i dati del gestionale: controllali nel profilo', 'ok', 7000);
      if (location.search) history.replaceState(null, '', location.pathname + location.hash);
    }

    async function loadAccount() {
      try {
        const r = await api('GET', '/api/account');
        S.account = r.account;
        S.enrollments = r.enrollments;
        S.games = r.games;
      } catch (e) {
        S.account = null;
        if (e.status !== 401) toast(e.message, 'error');
        try { S.games = await api('GET', '/api/public/games'); } catch { S.games = []; }
      }
      if (!S.games.some((g) => g.id === S.gameId)) S.gameId = S.games[0]?.id ?? null;
    }

    const brand = () => [h('div', { class: 'emblem' }, h('span', null, '0')), h('p', { class: 'eyebrow' }, 'Consiglio Zero · Chiamata ai Giochi del Buio')];
    const steps = (n) => h('div', { class: 'steps', 'aria-hidden': 'true' }, [1, 2, 3].map((i) => h('i', { class: i <= n ? 'on' : '' })));
    const enrolledIn = (gameId) => S.enrollments.find((e) => e.gameId === gameId);
    const whoBar = () => h('div', { class: 'who' }, h('span', null, 'Account ', h('strong', null, S.account.username)),
      h('a', { href: '#profilo' }, 'Profilo'),
      h('button', { class: 'linkish', type: 'button', onclick: async () => { await api('POST', '/api/team/logout').catch(() => {}); S.account = null; location.hash = ''; render(); } }, 'Esci'));

    // ---- passo 1: account (nuovo o esistente)
    function pageAccount() {
      const tab = (id, label) => h('button', { type: 'button', class: S.authTab === id ? 'on' : '', onclick: () => { S.authTab = id; render(); } }, label);
      const field = (label, attrs) => h('label', { class: 'field' }, h('span', null, label), h('input', { class: 'input', ...attrs }));
      const reg = h('form', { onsubmit: async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(reg).entries());
        if (fd.password !== fd.password2) return toast('Le due password non coincidono', 'error');
        try {
          const r = await api('POST', '/api/auth/register', fd);
          if (r.inviteError) toast(r.inviteError, 'error', 8000);
          if (r.home) { location.href = r.home; return; }
          toast('Account creato', 'ok');
          await loadAccount();
          location.hash = 'scelta';
        } catch (err) { toast(err.message, 'error', 6000); }
      } },
      h('fieldset', null, h('legend', null, 'Chi sei'),
        field('Nome e cognome', { name: 'name', required: true, autocomplete: 'name' }),
        field('Nome di battaglia (facoltativo)', { name: 'nickname' }),
        field('Team di softair di appartenenza', { name: 'softairTeam', required: true, maxlength: 60, placeholder: 'es. Zero Dark Team — oppure "nessuno"', autocomplete: 'organization' }),
        field('Telefono (facoltativo, solo per l\'organizzazione)', { name: 'phone', type: 'tel', autocomplete: 'tel' })),
      h('fieldset', null, h('legend', null, 'Il tuo accesso'),
        field('Username', { name: 'username', required: true, minlength: 3, maxlength: 30, pattern: '[A-Za-z0-9._\\-]{3,30}', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', title: 'Lettere, numeri, punto, trattino; da 3 a 30 caratteri' }),
        field('Password (almeno 8 caratteri)', { name: 'password', type: 'password', required: true, minlength: 8, autocomplete: 'new-password' }),
        field('Ripeti la password', { name: 'password2', type: 'password', required: true, minlength: 8, autocomplete: 'new-password' })),
      h('button', { class: 'btn btn-primary btn-xl btn-block', type: 'submit' }, 'Crea il mio account'),
      h('p', { class: 'muted small' }, 'Con username e password entrerai nell\'app da qualsiasi telefono, anche per le prossime partite. I dati servono solo all\'organizzazione.'));
      const login = h('form', { onsubmit: async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(login).entries());
        try {
          const r = await api('POST', '/api/auth/login', fd);
          if (r.role !== 'player') { location.href = r.home; return; }
          await loadAccount();
          location.hash = 'scelta';
          render();
        } catch (err) { toast(err.message, 'error', 6000); }
      } },
      field('Username', { name: 'username', required: true, autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false' }),
      field('Password', { name: 'password', type: 'password', required: true, autocomplete: 'current-password' }),
      h('button', { class: 'btn btn-primary btn-xl btn-block', type: 'submit' }, 'Accedi'));
      const opsBox = S.ops.length ? h('div', { class: 'stack' },
        S.ops.map((o) => h('a', { class: 'btn btn-xl btn-block', href: opsLink(o) }, `Accedi con ${o.name}`)),
        h('p', { class: 'muted small' }, 'Sei già nel gestionale della tua squadra? Entra con quell\'account: niente nuova password, nome e callsign arrivano da lì.')) : null;
      return [
        ...brand(),
        h('h1', null, 'I Giochi', h('br'), 'del ', h('em', null, 'Buio')),
        h('p', { class: 'lede' }, 'Il Consiglio chiama. Prima dicci chi sei, poi scegli la tua sfida: il Consiglio valuterà ogni candidatura e deciderà chi entra, con chi e sotto quale Sigillo.'),
        steps(1),
        h('div', { class: 'step' }, 'Passo 1 di 3 · Il tuo account'),
        opsBox,
        h('nav', { class: 'auth-tabs' }, tab('nuovo', 'Sono nuovo'), tab('accedi', 'Ho già un account')),
        S.authTab === 'accedi' ? login : reg,
      ];
    }

    // Posti liberi per la sfida (null = nessun limite, come per gli Eletti).
    const spotsLeft = (game, mode) => (mode === 'pair' ? game?.spots?.couples : mode === 'single' ? game?.spots?.singles : null) ?? null;
    const spotsText = (mode, n) => (n === 0 ? 'Posti esauriti'
      : mode === 'pair' ? `${n} ${n === 1 ? 'Settore libero' : 'Settori liberi'} per le coppie` : `${n} ${n === 1 ? 'posto libero' : 'posti liberi'} per i temerari`);

    // ---- passo 2: scelta della sfida
    function pageChoose() {
      const game = S.games.find((g) => g.id === S.gameId);
      const mine = game ? enrolledIn(game.id) : null;
      return [
        ...brand(), whoBar(),
        h('h1', null, 'I Giochi', h('br'), 'del ', h('em', null, 'Buio')),
        steps(2),
        h('div', { class: 'step' }, 'Passo 2 di 3 · Scegli la tua sfida'),
        S.games.length > 1 ? h('label', { class: 'field' }, h('span', null, 'Partita'),
          h('select', { class: 'input', onchange: (e) => { S.gameId = Number(e.target.value); render(); } }, S.games.map((g) => h('option', { value: g.id, selected: g.id === S.gameId }, g.name)))) : h('h2', null, game.name),
        mine ? enrolledCard(mine) : h('nav', { class: 'paths', 'aria-label': 'Le tre sfide' }, Object.entries(PATHS).map(([key, c]) => {
          const left = spotsLeft(game, c.mode);
          const full = left === 0;
          return h(full ? 'div' : 'a', { class: `path ${full ? 'path-full' : ''}`, href: full ? null : `#${key}`, 'aria-disabled': full ? 'true' : null },
            h('div', { class: 'path-head' }, h('span', { class: 'path-title' }, c.title), h('span', { class: 'path-tag' }, c.tag)),
            left != null ? h('div', { class: `spots ${full ? 'spots-full' : left <= 2 ? 'spots-low' : ''}` }, spotsText(c.mode, left)) : null,
            c.text.map((t) => h('p', null, t)),
            h('div', { class: 'dare' }, c.dare),
            full ? h('span', { class: 'btn path-go', 'aria-hidden': 'true' }, 'Posti esauriti') : h('span', { class: 'btn btn-primary path-go' }, 'Scelgo questa sfida →'));
        })),
      ];
    }

    async function sharePairCode(code) {
      const text = `I Giochi del Buio: siamo Legati! Registrati su ${location.origin}/iscrizione, scegli "I Legati" e inserisci il codice coppia ${code}`;
      try {
        if (navigator.share) await navigator.share({ title: 'I Giochi del Buio', text });
        else { await navigator.clipboard.writeText(text); toast('Invito copiato: incollalo al tuo Legato', 'ok'); }
      } catch { /* condivisione annullata */ }
    }

    function pairCodeCard(code) {
      return h('div', { class: 'card access' },
        h('div', { class: 'eyebrow' }, 'Codice coppia per il tuo Legato'),
        h('div', { class: 'mono code' }, code),
        h('p', { class: 'muted small' }, 'Il tuo compagno si registra, sceglie "I Legati" e inserisce questo codice: così il Consiglio vi valuta insieme.'),
        h('button', { class: 'btn btn-block', type: 'button', onclick: () => sharePairCode(code) }, 'Manda l\'invito al tuo Legato'));
    }

    function enrolledCard(e) {
      const c = PATHS[MODE_KEY[e.requestedRole]] || {};
      return h('div', { class: 'stack' },
        h('div', { class: 'done' },
          h('h2', null, 'Sei già iscritto'),
          h('p', null, `${c.title || 'Iscrizione'} · ${STATUS[e.status] || e.status}${e.teamId ? ' · sei già nella tua squadra' : ''}.`),
          h('a', { class: 'btn btn-primary btn-xl btn-block', href: '/#/home' }, 'Entra nell\'app')),
        e.pairCode ? pairCodeCard(e.pairCode) : null);
    }

    // ---- passo 3: conferma della sfida (i dati personali vengono dall'account)
    function pageForm(key) {
      const c = PATHS[key];
      const game = S.games.find((g) => g.id === S.gameId);
      if (enrolledIn(S.gameId)) { location.hash = 'scelta'; return pageChoose(); }
      const pairMode = { value: 'new' };
      const pairBox = h('div', { class: 'stack' });
      const drawPair = () => mount(pairBox,
        h('div', { class: 'auth-tabs' },
          h('button', { type: 'button', class: pairMode.value === 'new' ? 'on' : '', onclick: () => { pairMode.value = 'new'; drawPair(); } }, 'Creo io la coppia'),
          h('button', { type: 'button', class: pairMode.value === 'join' ? 'on' : '', onclick: () => { pairMode.value = 'join'; drawPair(); } }, 'Ho il codice del compagno')),
        pairMode.value === 'new'
          ? [h('p', { class: 'muted small' }, 'Riceverai un codice coppia da mandare al tuo Legato.'),
            h('label', { class: 'field' }, h('span', null, 'Nome della coppia (facoltativo)'), h('input', { class: 'input', name: 'teamName', maxlength: 60 }))]
          : h('label', { class: 'field' }, h('span', null, 'Codice coppia ricevuto dal tuo Legato'), h('input', { class: 'input mono', name: 'pairCode', required: true, maxlength: 8, autocapitalize: 'characters', spellcheck: 'false' })));
      if (c.mode === 'pair') drawPair();
      const form = h('form', { onsubmit: async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(form).entries());
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          const r = await api('POST', '/api/account/enroll', { gameId: S.gameId, mode: c.mode, teamName: fd.teamName, pairCode: pairMode.value === 'join' ? fd.pairCode : '', note: fd.note });
          S.sent = { key, ...r };
          await loadAccount();
          location.hash = 'fatto';
        } catch (err) {
          toast(err.message, 'error', 6000);
          btn.disabled = false;
        }
      } },
      h('div', { class: 'card' }, h('div', { class: 'eyebrow' }, 'Ti iscrivi come'), h('strong', null, S.account.name), h('span', { class: 'muted small' }, [S.account.nickname ? `«${S.account.nickname}»` : null, S.account.softairTeam].filter(Boolean).join(' · ')), h('a', { class: 'small', href: '#profilo' }, 'Modifica i tuoi dati')),
      c.mode === 'pair' ? pairBox : null,
      c.mode === 'elect' ? h('label', { class: 'field' }, h('span', null, 'Come puoi servire il Consiglio? (facoltativo)'),
        h('textarea', { class: 'input', name: 'note', rows: 3, maxlength: 300, placeholder: 'es. logistica al Cuore, presidio degli Altari, radio, primo soccorso…' })) : null,
      h('button', { class: 'btn btn-primary btn-xl btn-block', type: 'submit' }, c.cta));
      return [
        whoBar(),
        h('a', { class: 'btn btn-sm btn-ghost back', href: '#scelta' }, '‹ Cambia sfida'),
        steps(3),
        h('div', { class: 'step' }, `Passo 3 di 3 · ${game?.name || ''}`),
        h('div', { class: 'chosen' }, h('span', { class: 'path-tag' }, c.tag), h('span', { class: 'path-title' }, c.title),
          spotsLeft(game, c.mode) != null ? h('div', { class: `spots ${spotsLeft(game, c.mode) <= 2 ? 'spots-low' : ''}` }, spotsText(c.mode, spotsLeft(game, c.mode))) : null,
          h('div', { class: 'dare' }, c.dare)),
        form,
      ];
    }

    function pageDone() {
      const r = S.sent;
      const c = PATHS[r.key];
      return [
        ...brand(),
        h('div', { class: 'done' },
          h('h2', null, 'Il Consiglio ha ricevuto'),
          h('p', null, r.partner ? `Sei Legato con ${r.partner}. ${c.done}` : c.done),
          h('p', null, 'Non serve aspettare il giorno dei Giochi: entra subito nell\'app per conoscerla, con il giro guidato. Da qualsiasi telefono entri con username e password.'),
          h('a', { class: 'btn btn-primary btn-xl btn-block', href: '/#/home' }, 'Entra nell\'app')),
        r.pairCode ? pairCodeCard(r.pairCode) : null,
        h('a', { class: 'btn btn-ghost', href: '/regolamento.html' }, 'Leggi il regolamento'),
      ];
    }

    // ---- profilo e password
    function pageProfile() {
      const a = S.account;
      const field = (label, attrs) => h('label', { class: 'field' }, h('span', null, label), h('input', { class: 'input', ...attrs }));
      const form = h('form', { onsubmit: async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(form).entries());
        if (fd.password && fd.password !== fd.password2) return toast('Le due password nuove non coincidono', 'error');
        if (!fd.password) { delete fd.password; delete fd.currentPassword; }
        try { await api('PATCH', '/api/account', fd); toast('Profilo aggiornato', 'ok'); await loadAccount(); location.hash = 'scelta'; } catch (err) { toast(err.message, 'error', 6000); }
      } },
      h('fieldset', null, h('legend', null, 'I tuoi dati'),
        field('Nome e cognome', { name: 'name', required: true, value: a.name }),
        field('Nome di battaglia', { name: 'nickname', value: a.nickname || '' }),
        field('Team di softair di appartenenza', { name: 'softairTeam', required: true, value: a.softairTeam || '' }),
        field('Telefono', { name: 'phone', type: 'tel', value: a.phone || '' })),
      h('fieldset', null, h('legend', null, a.hasPassword ? 'Cambia password (facoltativo)' : 'Imposta una password (facoltativo)'),
        a.hasPassword ? field('Password attuale', { name: 'currentPassword', type: 'password', autocomplete: 'current-password' })
          : h('p', { class: 'muted small' }, `Entri con il gestionale. Con una password potrai entrare anche come @${a.username}.`),
        field('Nuova password', { name: 'password', type: 'password', minlength: 8, autocomplete: 'new-password' }),
        field('Ripeti la nuova password', { name: 'password2', type: 'password', minlength: 8, autocomplete: 'new-password' })),
      h('button', { class: 'btn btn-primary btn-xl btn-block', type: 'submit' }, 'Salva'));
      return [whoBar(), h('a', { class: 'btn btn-sm btn-ghost back', href: '#scelta' }, '‹ Indietro'), h('h2', null, 'Il tuo profilo'), form, opsSection()];
    }
    // Gestionali collegati all'account: entrare da lì, collegarne uno, scollegarlo.
    function opsSection() {
      const a = S.account;
      const linked = a.ops || [];
      if (!linked.length && !S.ops.length) return null;
      const unlink = async (i) => {
        if (!confirm(`Scollegare ${i.providerName}? Non potrai più entrare da lì finché non lo ricolleghi.`)) return;
        try { await api('DELETE', `/api/account/ops/${i.id}`); toast('Gestionale scollegato', 'ok'); await loadAccount(); render(); } catch (err) { toast(err.message, 'error', 6000); }
      };
      const free = S.ops.filter((o) => !linked.some((i) => i.iss === o.issuer));
      return h('fieldset', null, h('legend', null, 'Gestionale della squadra'),
        linked.map((i) => h('div', { class: 'card' },
          h('strong', null, i.providerName),
          h('span', { class: 'muted small' }, [i.opsName, i.squadra].filter(Boolean).join(' · ')),
          h('button', { class: 'linkish', type: 'button', onclick: () => unlink(i) }, 'Scollega'))),
        linked.length ? null : h('p', { class: 'muted small' }, 'Collega l\'account del gestionale della tua squadra: poi entri con un tocco, senza password.'),
        free.map((o) => h('a', { class: 'btn btn-block', href: opsLink(o, true) }, `Collega ${o.name}`)));
    }

    function render() {
      const key = location.hash.slice(1);
      if (!S.account) return mount(root, pageAccount());
      if (key === 'profilo') return mount(root, pageProfile());
      if (!S.games.length && !S.enrollments.length) {
        return mount(root, ...brand(), whoBar(), h('h1', null, 'I Giochi', h('br'), 'del ', h('em', null, 'Buio')),
          h('div', { class: 'card' }, h('strong', null, 'Le iscrizioni sono chiuse.'), h('p', { class: 'muted' }, 'Non ci sono partite aperte alle iscrizioni in questo momento. Il tuo account resta valido per le prossime.')));
      }
      if (key === 'fatto' && S.sent) return mount(root, pageDone());
      if (!S.games.length) return mount(root, ...brand(), whoBar(), S.enrollments[0] ? enrolledCard(S.enrollments[0]) : null);
      mount(root, PATHS[key] ? pageForm(key) : pageChoose());
    }

    window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });
    S.ops = await api('GET', '/api/public/ops').catch(() => []);
    await loadAccount();
    render();
  </script>
</body>
</html>
