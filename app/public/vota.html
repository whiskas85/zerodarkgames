<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121613">
<title>Vota la tua coppia · I Giochi del Buio</title>
<meta name="description" content="Il favore del pubblico: vota la coppia che vuoi vedere vincere ai Giochi del Buio. Le prime tre ricevono un Dono.">
<meta property="og:title" content="Vota la tua coppia · I Giochi del Buio">
<meta property="og:description" content="Il favore del pubblico: le prime tre coppie ricevono un Dono del Consiglio.">
<meta property="og:image" content="/icons/icon-512.png">
<meta property="og:type" content="website">
<link rel="icon" href="/icons/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#121613;--paper:#1a1f1b;--ink:#dad7cc;--muted:#959a90;--line:#333a34;--blood:#d65a43;--brass:#c9a55e;--ok:#46c46a;
  --f-display:"Big Shoulders Stencil Display",Impact,sans-serif;--f-mono:"IBM Plex Mono",monospace;--f-ui:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:680px;margin:0 auto}
header{padding:28px 0 12px;text-align:center;display:grid;gap:8px;justify-items:center}
.emblem{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;position:relative}
.emblem::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid var(--blood)}
.emblem span{font-family:var(--f-display);font-weight:900;font-size:34px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,11vw,64px);line-height:.9;margin:0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--blood)}
.lede{margin:0;color:var(--muted);max-width:46ch}
.status{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:13px}
.status.open{border-color:var(--ok);color:var(--ok)} .status.closed{border-color:var(--blood);color:var(--blood)}
h2{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;margin:28px 0 12px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:8px}
.step{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.step .medal{font-size:30px;line-height:1}
.step .name{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.step .pct{font-family:var(--f-mono);font-weight:600;font-size:20px}
.step .block{width:100%;border-radius:8px 8px 0 0;background:var(--paper);border:2px solid var(--c,var(--line));border-bottom:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:28px;color:var(--c,var(--ink))}
.step.p1 .block{height:120px} .step.p2 .block{height:88px} .step.p3 .block{height:64px}
.empty{color:var(--muted);text-align:center;padding:18px;border:1.5px dashed var(--line);border-radius:10px}
.teams{display:grid;gap:10px}
.team{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--paper);border:2px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:10px}
.team.mine{border-color:var(--ok);border-left-color:var(--c,var(--ok))}
.stamp{width:48px;height:48px;border:3px solid var(--c,var(--ink));display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--c,var(--ink))}
.tname{font-weight:700} .tsub{font-size:13px;color:var(--muted)}
.people{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px;font-size:14px}
.people li::before{content:"▸ ";color:var(--c,var(--brass))}
.stamp{width:56px;height:56px} .stamp.has-logo{border:0;background:transparent}
.stamp img,.plogo img{width:100%;height:100%;object-fit:contain}
.plogo{width:52px;height:52px;display:grid;place-items:center;border:3px solid var(--c,var(--ink));font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--c,var(--ink))}
.plogo.has-logo{border:0}
.psec{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.bar{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex;align-items:center}
.bar i{display:block;height:100%;background:var(--c,var(--brass));border-radius:4px;transition:width .6s}
.pctline{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:-6px}
button.vote{font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:2px solid var(--blood);background:var(--blood);color:#fff;cursor:pointer;white-space:nowrap}
button.vote.done{background:transparent;border-color:var(--ok);color:var(--ok)}
button.vote:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:20px}
.note a{color:var(--brass)}
.ts{display:flex;justify-content:center;margin:14px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 16px;border-radius:10px;background:var(--paper);border:2px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5);font-weight:600;z-index:10}
.toast.err{border-color:var(--blood)} .toast.ok{border-color:var(--ok)}
.verified{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--brass);color:var(--brass);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap"><div id="app"><header><div class="emblem"><span>0</span></div><p class="eyebrow">Caricamento…</p></header></div>
<div class="ts" id="ts" hidden></div><p class="note" id="note"></p></div>
<script>
const $app = document.getElementById('app');
let S = null; let tsToken = null; let tsWidget = null; let busy = false;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pct = (n) => `${String(n).replace('.', ',')}%`;
const initials = (n) => String(n || '?').trim().slice(0, 2).toUpperCase();
function toast(msg, kind = '') { document.querySelector('.toast')?.remove(); const el = document.createElement('div'); el.className = `toast ${kind}`; el.textContent = msg; document.body.append(el); setTimeout(() => el.remove(), 4500); }
const fmtWhen = (ts) => new Date(ts).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });

async function load() {
  try { const r = await fetch('/api/public/vote', { credentials: 'same-origin' }); S = await r.json(); render(); } catch { if (!S) $app.innerHTML = '<header><p class="eyebrow">Senza rete: riprova tra poco</p></header>'; }
}
function teamName(t) { return t.displayName || `Settore ${t.sectorName}`; }
// Il logo della coppia (se c'è), altrimenti il numero romano del Settore.
function mark(t, cls = 'stamp') { return t.logo ? `<span class="${cls} has-logo"><img src="${esc(t.logo)}" alt="Logo ${esc(teamName(t))}"></span>` : `<span class="${cls}">${esc(t.roman)}</span>`; }
// Numero romano e Settore; se la coppia non ha un nome suo, il nome è già «Settore …»: resta solo il numero.
const sector = (t) => (t.displayName ? `${esc(t.roman)} · Settore ${esc(t.sectorName)}` : `Settore ${esc(t.roman)}`);
const people = (t) => `<ul class="people">${(t.members || []).map((m) => `<li>${esc(m.name)}</li>`).join('')}</ul>`;
function render() {
  if (!S.game) { $app.innerHTML = `<header><div class="emblem"><span>0</span></div><h1>Nessuna <em>votazione</em></h1><p class="lede">In questo momento non c'è una votazione aperta. Torna quando il Consiglio la apre.</p></header>`; return; }
  const status = S.open ? `<span class="status open">● Votazione aperta${S.closesAt ? ` · chiude ${esc(fmtWhen(S.closesAt))}` : ''}</span>`
    : S.closed ? '<span class="status closed">Votazione chiusa</span>' : `<span class="status">Apre ${S.opensAt ? esc(fmtWhen(S.opensAt)) : 'a breve'}</span>`;
  const order = [1, 0, 2];
  const podium = S.podium.length ? `<div class="podium">${order.map((i) => S.podium[i] ? `<div class="step p${i + 1}" style="--c:${esc(S.podium[i].color || '')}"><span class="medal">${['🥇', '🥈', '🥉'][i]}</span>${mark(S.podium[i], 'plogo')}<span class="name">${esc(teamName(S.podium[i]))}</span><span class="psec">${sector(S.podium[i])}</span><span class="pct">${pct(S.podium[i].pct)}</span><div class="block">${esc(S.podium[i].roman)}</div></div>` : '<div></div>').join('')}</div>`
    : '<p class="empty">Ancora nessun voto: il primo puoi darlo tu.</p>';
  const teams = S.teams.map((t) => {
    const mine = S.myVote === t.id;
    return `<div class="team ${mine ? 'mine' : ''}" style="--c:${esc(t.color || '')}">
      ${mark(t)}
      <div><div class="tname">${esc(teamName(t))}</div><div class="tsub">${sector(t)}</div>${people(t)}</div>
      <button class="vote ${mine ? 'done' : ''}" data-id="${t.id}" ${!S.open || busy ? 'disabled' : ''}>${mine ? 'Il tuo voto ✓' : S.myVote ? 'Cambia voto' : 'Vota'}</button>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, t.pct))}%"></i></div>
      <div class="pctline"><span>${pct(t.pct)}</span><span>${mine ? 'hai votato questa coppia' : ''}</span></div></div>`;
  }).join('');
  $app.innerHTML = `<header><div class="emblem"><span>0</span></div><p class="eyebrow">I Giochi del Buio · ${esc(S.game.name)}</p>
      <h1>${esc(S.title).replace(/pubblico/i, '<em>pubblico</em>')}</h1>
      <p class="lede">Vota la coppia che vuoi vedere vincere. Le prime tre ricevono un Dono del Consiglio prima della partita.</p>${status}
      ${S.verified ? `<span class="verified">Il tuo voto vale ×${S.weight}: sei entrato con il tuo account</span>` : ''}</header>
    <h2>Il podio</h2>${podium}
    <h2>Le coppie</h2>${S.teams.length ? `<div class="teams">${teams}</div>` : '<p class="empty">Il Consiglio non ha ancora scelto le coppie da votare.</p>'}
`;
  // Fuori dalla parte che si ridisegna: il riquadro anti-robot non si azzera con gli aggiornamenti.
  document.getElementById('note').innerHTML = `Un voto per telefono (puoi cambiarlo finché la votazione è aperta). Si vedono solo le percentuali.<br>
      ${S.verified ? '' : 'Hai un account dei Giochi o di Zero Dark Ops? <a href="/">Entra</a> e torna qui: il tuo voto vale di più.'}`;
  document.getElementById('ts').hidden = !(S.turnstile && S.open);
  for (const b of $app.querySelectorAll('button.vote')) b.addEventListener('click', () => vote(Number(b.dataset.id)));
  if (S.turnstile && S.open) mountTurnstile();
}
function mountTurnstile() {
  const box = document.getElementById('ts');
  if (!box) return;
  if (tsWidget != null) return;
  const go = () => { if (tsWidget == null) tsWidget = window.turnstile.render(box, { sitekey: S.turnstile, theme: 'dark', callback: (t) => { tsToken = t; }, 'expired-callback': () => { tsToken = null; } }); };
  if (window.turnstile) go();
  else if (!document.getElementById('ts-js')) { const s = document.createElement('script'); s.id = 'ts-js'; s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; s.async = true; s.onload = go; document.head.append(s); }
}
async function vote(teamId) {
  if (busy) return;
  if (S.turnstile && !tsToken) { toast('Conferma prima di non essere un robot (il riquadro qui sotto)', 'err'); document.getElementById('ts')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  busy = true; render();
  try {
    const r = await fetch('/api/public/vote', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ teamId, token: tsToken }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Voto non riuscito');
    S = data; toast('Voto registrato. Grazie!', 'ok');
  } catch (e) { toast(e.message, 'err'); }
  // Un token vale una volta: dopo il voto se ne chiede uno nuovo.
  if (tsWidget != null) { try { window.turnstile.reset(tsWidget); } catch {} }
  tsToken = null; busy = false; render();
}
load();
setInterval(() => { if (!busy && !document.hidden) load(); }, 15000);
</script>
</body>
</html>
