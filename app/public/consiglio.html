<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consiglio Zero</title>
  <meta name="theme-color" content="#0f1310">
  <meta name="color-scheme" content="dark">
  <style>html, body { background: #0f1310; }</style>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/regia.css">
  <style>
    .council { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
    .council-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .council-tile { display: grid; gap: 6px; align-content: center; min-height: 104px; padding: 14px; background: var(--paper); border: 2px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 17px; }
    .council-tile:hover, .council-tile:focus-visible { border-color: var(--brass); }
    .council-tile .ico { font-size: 28px; line-height: 1; color: var(--brass); }
    .council-tile .tiny { font-weight: 400; }
    .gift-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid var(--line); background: var(--paper); }
    .gift-row .g-ico { font-size: 22px; width: 32px; text-align: center; }
    .gift-row .g-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .gift-list { display: grid; gap: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/js/consiglio.js"></script>
</body>
</html>
